name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Pushes that change nothing the site serves don't deploy: docs and agent
    # notes. A push that also changes anything else deploys as usual.
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy (owner's rule for every repo, unless they say
# otherwise for this one). A deploy that has started always finishes; GitHub
# keeps one pending run behind it, and a newer push replaces that pending run
# for free, so a burst of pushes publishes once per deploy and the queue
# collapses into the newest. Cancelling instead throws away the minutes a run
# has already used, and a steady stream of pushes can cancel every deploy
# before one finishes, leaving the site stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hung run otherwise bills up to 6 h
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on via the API, so the site works without
      # anyone flipping Settings -> Pages -> Source by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a hung run otherwise bills up to 6 h
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # The uploaded site would otherwise sit in Actions storage for a day
      # after every push, which counts against the account's quota while the
      # repository is private. Pages keeps its own copy, so delete ours as
      # soon as the deploy is done.
      - name: Delete the deployed site artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false
